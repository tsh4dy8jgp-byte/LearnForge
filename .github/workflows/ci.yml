name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore LearnForge.slnx
      - run: dotnet build LearnForge.slnx -c Release --no-restore
      - run: dotnet test LearnForge.slnx -c Release --no-build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm test --prefix apps/web
      - run: npm run build --prefix apps/web

  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # make api-types runs openapi-ts from apps/web, so this job needs the web dependencies too.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: dotnet restore LearnForge.slnx
      - run: npm ci --prefix apps/web
      - run: make check-content
      - run: make api-types
      - run: git diff --exit-code -- apps/web/openapi apps/web/src/app/generated
