name: learnforge
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: learnforge
      POSTGRES_USER: learnforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnforge-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnforge -d learnforge"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Database__Provider: Postgres
      Database__AutoMigrate: "true"
      ConnectionStrings__Database: Host=db;Database=learnforge;Username=learnforge;Password=${POSTGRES_PASSWORD:-learnforge-local-only}
      AllowedHosts: ${ALLOWED_HOSTS:-localhost;127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - protection-keys:/app/data
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  protection-keys:
